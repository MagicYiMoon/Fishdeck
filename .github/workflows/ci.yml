name: 鱼笺 checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  astrbot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: fishdeck
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -r fishdeck/requirements.txt ruff
      - run: ruff check fishdeck && ruff format --check fishdeck
      - run: python -m unittest discover -s fishdeck/tests
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test
        working-directory: harness
